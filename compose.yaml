# Quickstart:
#   docker compose up --build
#   docker compose exec staw staw-server token mint   # your bearer token
# then open http://127.0.0.1:8080 and/or connect an MCP client to
# http://127.0.0.1:8080/mcp with `Authorization: Bearer <token>`.
#
# Authentication is always on. The port is published on the host loopback
# only — keep it that way, or behind TLS on a network you trust.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: staw
      POSTGRES_PASSWORD: staw
      POSTGRES_DB: staw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staw"]
      interval: 2s
      timeout: 2s
      retries: 15

  staw:
    build: .
    environment:
      STAW_DATABASE_URL: postgres://staw:staw@postgres/staw
      # The identity /users/me resolves to (and MCP authorship records):
      STAW_USER__HANDLE: admin
      STAW_USER__NAME: Admin
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The Slack bot (crates/staw-slack), from the same image. Off unless
  # its profile is asked for: `docker compose --profile slack up --build`.
  # It reads ./staw-slack.toml (the README's "Slack bot" section has one);
  # without that file compose refuses to start it.
  staw-slack:
    build: .
    profiles: ["slack"]
    entrypoint: ["staw-slack"]
    environment:
      STAW_SLACK_CONFIG: /etc/staw/slack.toml
    volumes:
      - type: bind
        source: ./staw-slack.toml
        target: /etc/staw/slack.toml
        read_only: true
        bind:
          create_host_path: false
      # People's Staw refresh tokens: [store] path in the file above
      # must point inside it.
      - slack-tokens:/var/lib/staw-slack
    # Staw's /mcp answers only to its own host names (rmcp's DNS-
    # rebinding guard), so the bot shares the staw container's network
    # and reaches it at http://127.0.0.1:8080 — the address a browser on
    # this host uses for the links the bot sends, too.
    network_mode: "service:staw"
    depends_on:
      - staw

volumes:
  pgdata:
  slack-tokens:
